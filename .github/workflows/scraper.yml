name: Autonomous Market Scraper

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight UTC
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  scrape-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
          
      - name: Execute Pipeline
        run: |
          cd backend
          python scraper.py

      - name: Commit and Push Updated Auction Comps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/auctions.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): sync latest auction lots [skip ci]" && git push)
